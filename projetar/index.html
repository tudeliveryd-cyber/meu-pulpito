function tSermao(box){const S=ITEMS.filter(x=>x.t==='sermao').sort((a,b)=>(b.at||0)-(a.at||0));const s=SID&&S.find(x=>x.id===SID)||S[0];if(s)SID=s.id;

  box.innerHTML=`${S.length>1?`<select class="inp" id="ssel" style="margin-bottom:10px">${S.map(x=>`<option value="${x.id}"${x.id===s.id?' selected':''}>${esc(x.n)}</option>`).join('')}</select>`:''}<h2 style="margin-bottom:8px">${esc(s.n)}</h2>${s.v?`<p class="sub" style="margin-bottom:8px">${esc(s.v)}</p>`:''}
  <div class="slides"><button class="sl${ROOM.now&&ROOM.now.sid===s.id&&ROOM.now.i===-1?' on':''}" data-sp="-1"><b>${esc(s.n)}</b>${s.v?'\n'+esc(s.v):''}</button>${(s.pts||[]).map((p,i)=>`<button class="sl${ROOM.now&&ROOM.now.sid===s.id&&ROOM.now.i===i?' on':''}" data-sp="${i}"><b>${i+1}. ${esc(p.t)}</b>${p.v?'\n'+esc(p.v):''}</button>`).join('')}</div>`;
  const sel=$('#ssel');if(sel)sel.onchange=()=>{SID=sel.value;drawTab()};
  $$('[data-sp]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sp;if(i<0)setNow({type:'sermon',title:L==='pt'?'Mensagem':'Mensaje',text:s.n,ref:s.v||'',sid:s.id,i:-1});else{const p=s.pts[i];setNow({type:'sermon',title:(L==='pt'?'Ponto ':'Punto ')+(i+1),text:p.t,ref:p.v||'',sid:s.id,i})}$$('.sl').forEach(x=>x.classList.toggle('on',x===b))})}
/* Relógio */
function tClock(box){box.innerHTML=`<div class="card"><label class="lbl">${esc(t('clock_m'))}</label><input class="inp" id="cm" type="number" inputmode="numeric" value="5" min="1" max="180"><label class="lbl">${esc(t('clock_msg'))}</label><input class="inp" id="cmsg" autocomplete="off" placeholder="${L==='pt'?'Ex.: O culto começa em':'Ej.: El culto comienza en'}"><button class="btn gold block" id="cgo">${esc(t('clock_go'))}</button><button class="btn ghost block" id="cnow">${esc(t('clock_now'))}</button></div>`;
  $('#cgo').onclick=()=>{const m=Math.max(1,Math.min(180,+$('#cm').value||5));setNow({type:'clock',end:Date.now()+m*60000,msg:$('#cmsg').value.trim().slice(0,80)})};$('#cnow').onclick=()=>setNow({type:'clock',msg:$('#cmsg').value.trim().slice(0,80)})}
/* Ajustes */
const BGS=[['b','bg_b'],['n','bg_n'],['deep','bg_deep'],['slate','bg_slate'],['wine','bg_wine'],['forest','bg_forest'],['gold','bg_gold'],['light','bg_light'],['waves','bg_waves'],['dots','bg_dots']];
function tCfg(box){const I=ITEMS.filter(x=>x.t==='img');const cur=CFG.bg||'b';
  box.innerHTML=`<div class="card"><label class="lbl">${esc(t('fs'))}</label><div class="seg" data-k="fs">${[[.8,'A-'],[1,'A'],[1.25,'A+'],[1.5,'A++']].map(([v,l])=>`<button data-v="${v}" aria-pressed="${+CFG.fs===v}">${l}</button>`).join('')}</div>
  <div class="seg" data-k="serif"><button data-v="false" aria-pressed="${!CFG.serif}">${esc(t('bg_sa'))}</button><button data-v="true" aria-pressed="${!!CFG.serif}">${esc(t('bg_s'))}</button></div>
  <label class="lbl">${esc(t('bg'))}</label><div class="swat" id="swat">${BGS.map(([k,l])=>`<button data-bg="${k}" aria-pressed="${cur===k}"><div class="bg-${k}" style="position:absolute;inset:0"></div><span>${esc(t(l))}</span></button>`).join('')}</div>
  <label class="lbl">${esc(t('bg_my'))}</label><div class="swat" id="swatI">${I.map(x=>`<button data-bg="img:${x.id}" aria-pressed="${cur==='img:'+x.id}"><img src="${x.d}" alt=""><span>${esc(x.n||'')}</span></button>`).join('')}<label class="btn sm ghost" style="cursor:pointer;aspect-ratio:auto;height:auto;min-height:48px;border-radius:10px">${ic('img')}${esc(t('bg_add'))}<input type="file" accept="image/*" id="bgfile" hidden></label></div>
  <p class="sub" style="font-size:12.5px">${esc(t('bg_my_d'))}</p>
  <label class="lbl">${esc(t('dim'))} · <span id="dimv">${Math.round((+CFG.dim||0)*100)}%</span></label><input type="range" id="dimR" min="0" max="80" step="5" value="${Math.round((+CFG.dim||0)*100)}"><p class="sub" style="font-size:12.5px">${esc(t('dim_d'))}</p>
  <label class="row" style="gap:10px;align-items:center"><input type="checkbox" id="wm" ${CFG.wm===false?'':'checked'} style="width:20px;height:20px"><span style="font-size:14px">${esc(t('wm'))}</span></label></div>`;
  $$('.seg button').forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.k;let v=b.dataset.v;v=v==='true'?true:v==='false'?false:isNaN(+v)?v:+v;CFG[k]=v;$$('button',b.parentNode).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));saveCfg()});
  $$('[data-bg]').forEach(b=>b.onclick=()=>{CFG.bg=b.dataset.bg;$$('[data-bg]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));saveCfg()});
  const dim=$('#dimR');dim.oninput=()=>{$('#dimv').textContent=dim.value+'%'};dim.onchange=()=>{CFG.dim=(+dim.value)/100;saveCfg()};
  $('#wm').onchange=()=>{CFG.wm=$('#wm').checked;saveCfg()};
  $('#bgfile').onchange=()=>{const f=$('#bgfile').files[0];if(!f)return;addImage(f,id=>{CFG.bg='img:'+id;saveCfg();toast(t('saved'))})}}
function addImage(f,done){const I=ITEMS.filter(x=>x.t==='img');if(I.length>=20){toast(t('ibig'));return}const img=new Image();const u=URL.createObjectURL(f);img.onload=()=>{const M=1280;const r=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);const cx=cv.getContext('2d');cx.drawImage(img,0,0,cv.width,cv.height);let q=.82,d=cv.toDataURL('image/jpeg',q);while(d.length>280000&&q>.4){q-=.1;d=cv.toDataURL('image/jpeg',q)}URL.revokeObjectURL(u);if(d.length>280000){toast(t('ibig'));return}
  const id=uid();roomRef().collection('itens').doc(id).set({t:'img',n:f.name.replace(/\.[a-z0-9]+$/i,'').slice(0,60),d,at:Date.now()}).then(()=>{toast(t('saved'));done&&done(id)}).catch(()=>toast(t('offline')))};img.src=u}
/* boot */
const h=(location.hash||'').slice(1).toUpperCase().replace(/[^A-Z0-9]/g,'');const AUTO=/[?&]tela=1/.test(location.search);const saved=ls.get('mp.proj.code','');if(h.length>=16)enter(h,AUTO);else if(saved&&saved.length>=16)enter(saved);else vEntry();
})();
</script>
