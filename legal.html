<style>
:root{--navy:#0B1220;--ink:#0F172A;--text:#334155;--muted:#64748B;--line:#E6E8EE;--gold:#C9A24E;--gold-2:#B8913F;--head:'Manrope','Inter',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:16.5px;line-height:1.7;color:var(--text);background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit}
header{background:var(--navy);padding:calc(env(safe-area-inset-top,0px) + 14px) 24px 14px}
header .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--head);font-weight:800;font-size:16px}
.brand img{height:34px}.brand span{color:var(--gold)}
.lang{margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.lang button{border:0;background:none;color:rgba(255,255,255,.65);font-family:var(--head);font-weight:700;font-size:12px;height:28px;padding:0 10px;border-radius:14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
main{max-width:820px;margin:0 auto;padding:48px 24px 80px}
h1{font-family:var(--head);color:var(--ink);font-size:clamp(30px,4vw,40px);line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.upd{color:var(--muted);font-size:14px;margin:0 0 28px}
.toc{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px}
.toc a{font-family:var(--head);font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset;border-radius:20px;padding:8px 16px}
h2{font-family:var(--head);color:var(--ink);font-size:26px;letter-spacing:-.015em;margin:56px 0 8px;scroll-margin-top:20px}
h3{font-family:var(--head);color:var(--ink);font-size:17px;margin:26px 0 4px}
p{margin:0 0 10px}
.note{background:#F5F6F8;border-radius:14px;padding:14px 18px;font-size:15px;margin-top:20px}
footer{border-top:1px solid var(--line);max-width:820px;margin:0 auto;padding:24px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{text-decoration:none}footer a:hover{color:var(--ink)}
