<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1220">
<title>Escritório · Meu Púlpito</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Escritório">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1220;--navy2:#111A2E;--navy3:#1A2540;--gold:#C9A24E;--gold2:#D6AD55;--ink:#0F172A;--text:#334155;--muted:#64748B;--line:#E3E6EC;--bg:#F3F4F7;--card:#fff;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--head:'Inter',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--head);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px}
button,input,select,textarea{font:inherit}a{color:inherit}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left));padding-top:max(12px,env(safe-area-inset-top))}
.top img{height:30px}.top b{font-weight:800;letter-spacing:.01em}.top b span{color:var(--gold2)}.top small{display:block;font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.55);font-weight:700}
.top .sp{flex:1}.top button{background:none;border:0;color:#fff;display:flex;align-items:center;gap:6px;cursor:pointer;opacity:.85;padding:6px}
.tabs{position:sticky;top:54px;z-index:9;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:13px 12px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer;border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:6px}
.tabs button[aria-pressed=true]{color:var(--ink);border-color:var(--gold)}
.bdg{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:20px;color:var(--ink);margin:6px 0 14px}h3{font-size:16px;color:var(--ink);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.k{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 0 0 1px var(--line) inset}.k b{display:block;font-size:24px;color:var(--ink);font-weight:800;margin-top:4px}.k span{font-size:12.5px;color:var(--muted);font-weight:600}.k em{font-style:normal;font-size:12px;color:var(--muted)}
.k.gold{background:var(--navy);box-shadow:none}.k.gold b{color:var(--gold2)}.k.gold span,.k.gold em{color:rgba(255,255,255,.7)}
.card{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line) inset;padding:14px 16px;margin-top:14px}
.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column}.it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.it:first-child{border-top:0}
.it .b{flex:1;min-width:0}.it b{color:var(--ink)}.it .s{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:#EEF0F4;color:var(--text)}
.tag.ok{background:#DCFCE7;color:var(--ok)}.tag.warn{background:#FEF3C7;color:var(--warn)}.tag.bad{background:#FEE2E2;color:var(--bad)}.tag.gold{background:rgba(201,162,78,.16);color:#8A6A22}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;border:0;cursor:pointer;font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap}
.btn.dark{background:var(--navy);color:#fff}.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}.btn.red{background:#fff;color:var(--bad);box-shadow:0 0 0 1px #F3C4C4 inset}
.btn:disabled{opacity:.5}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.inp{width:100%;height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none}.inp:focus{border-color:var(--gold)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.4}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.chat{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
.cl{max-height:70vh;overflow:auto}.cl .it{cursor:pointer;padding:10px;border-radius:12px;border:0;margin-top:2px}.cl .it:hover,.cl .it.on{background:#F1F3F7}
.conv{display:flex;flex-direction:column;gap:10px}.msgs{display:flex;flex-direction:column;gap:8px;height:52vh;overflow:auto;padding:12px;background:#F6F7FA;border-radius:12px}
.m{max-width:80%;display:flex;flex-direction:column;gap:3px}.m span{padding:9px 12px;border-radius:14px;line-height:1.4;overflow-wrap:anywhere}.m small{font-size:11px;color:var(--muted)}
.m.u{align-self:flex-start}.m.u span{background:#fff;box-shadow:0 0 0 1px var(--line) inset;color:var(--ink);border-bottom-left-radius:4px}
.m.a{align-self:flex-end;align-items:flex-end}.m.a span{background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.send{display:flex;gap:8px;align-items:flex-end}.send textarea{flex:1}
.ov{position:fixed;inset:0;background:rgba(11,18,32,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.seg{display:flex;gap:4px;background:#EEF0F4;border-radius:11px;padding:3px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:20px;padding:26px;box-shadow:0 0 0 1px var(--line) inset;display:flex;flex-direction:column;gap:12px;text-align:center}
.login img{height:64px;margin:0 auto}.err{color:var(--bad);font-size:13.5px;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-top:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);font-weight:700;border-top:0}td.r,th.r{text-align:right}
@media (max-width:760px){.chat{grid-template-columns:1fr}.chat.open .cl{display:none}.chat:not(.open) .conv{display:none}.two{grid-template-columns:1fr}}
.k.on{box-shadow:0 0 0 1.5px #2E9D63 inset}.k.on b{color:#2E9D63}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2E9D63;margin-right:8px;box-shadow:0 0 0 4px rgba(46,157,99,.18);vertical-align:1px}
.vch{display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:16px;padding-bottom:16px}.vch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}.vch i{display:block;width:100%;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px}.vch span{position:absolute;bottom:-16px;font-size:10.5px;color:var(--muted)}
.vgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:16px}.vgr h3{font-size:14px;margin-bottom:6px}
.vb{display:grid;grid-template-columns:100px 1fr 40px;gap:8px;align-items:center;font-size:13px;padding:3px 0}.vb i{height:8px;background:#EEF0F4;border-radius:5px;overflow:hidden}.vb u{display:block;height:100%;background:var(--navy);border-radius:5px}.vb b{text-align:right;color:var(--ink)}
td .inp{height:38px;min-width:0}
.top #toapp{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:6px 8px;border-radius:8px}.top #toapp svg{width:18px;height:18px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="cash" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
<symbol id="quote" viewBox="0 0 24 24"><path d="M7 7h4v4c0 3-1.5 5-4 6M15 7h4v4c0 3-1.5 5-4 6"/></symbol>
<symbol id="out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
<symbol id="undo" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
<symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
<symbol id="pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
</defs>
</svg>
<div id="root"></div>
<script src="../app/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Escritório do Meu Púlpito — só para o administrador. Lê números e planos; nunca o conteúdo dos sermões (as regras do Firebase não deixam). */
(function(){'use strict';
const ADMIN='tudeliveryd@gmail.com';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const fmtN=n=>Math.round(n||0).toLocaleString('es-PY');
const money=(v,c)=>c==='brl'?'R$ '+(+v||0).toLocaleString('pt-BR'):'₲ '+fmtN(v);
const fmtD=ts=>ts?new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtDT=ts=>ts?new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const rel=ts=>{if(!ts)return'—';const d=Math.floor((Date.now()-ts)/864e5);return d<=0?'hoje':d===1?'ontem':d+' dias atrás'};
const PMON={m:1,t:3,a:12,mi:1,ti:3,ai:12},PNAME={m:'Mensal',t:'Trimestral',a:'Anual',mi:'Igreja Mensal',ti:'Igreja Trimestral',ai:'Igreja Anual'};
const addMonths=(ts,n)=>{const d=new Date(ts);const day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<day)d.setDate(0);return d.getTime()};
const isoDay=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>{try{return new Date().toLocaleDateString('en-CA',{timeZone:'America/Asuncion'})}catch(e){return isoDay(Date.now())}};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function sheet(html){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="sheet">${html}</div>`;ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});document.body.appendChild(ov);return ov.firstElementChild}
const closeSheets=()=>$$('.ov').forEach(o=>o.remove());
function sure(b,txt){if(b.dataset.sure)return true;b.dataset.sure=1;const o=b.innerHTML;b.textContent=txt||'Confirmar? Toque de novo';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.innerHTML=o}},3000);return false}
const waNum=w=>String(w||'').replace(/\D/g,'');
// idioma da mensagem: o idioma que o pastor usa no app; se não souber, pelo país do WhatsApp
const waLang=r=>{if(r.lang==='pt'||r.lang==='es')return r.lang;const w=String(r.wa||'');return w.startsWith('+55')||w.startsWith('55')?'pt':'es'};
const first=n=>String(n||'').trim().replace(/^(pr|pra|pb|ev|rev)\.?\s+/i,'').split(/\s+/)[0]||'';

firebase.initializeApp(window.FIREBASE_CONFIG);try{firebase.firestore().settings({experimentalForceLongPolling:true,merge:true})}catch(e){}const auth=firebase.auth(),db=firebase.firestore();
let D={stats:[],planos:{},roleta:{},depo:[],suporte:[],contato:[],site:{},cfg:{},visits:null},TAB=location.hash.slice(1)||'resumo',CONV=null,poll=0,pollUn=null;

function loginView(err){$('#root').innerHTML=`<form class="login" id="lg"><img src="../app/mark-light.png" alt=""><h2 style="margin:0">Escritório do Meu Púlpito</h2><p style="margin:0;color:var(--muted)">Acesso só para o administrador.</p>
  <input class="inp" id="lgE" type="email" placeholder="E-mail" autocomplete="username" value="${esc(ADMIN)}"><input class="inp" id="lgP" type="password" placeholder="Senha" autocomplete="current-password">
  ${err?`<p class="err">${esc(err)}</p>`:''}<button class="btn dark" style="height:46px">${ic('lock')}Entrar</button></form>`;
  $('#lg').onsubmit=e=>{e.preventDefault();auth.signInWithEmailAndPassword($('#lgE').value.trim(),$('#lgP').value).catch(()=>loginView('E-mail ou senha incorretos.'))}}
auth.onAuthStateChanged(u=>{if(!u){loginView();return}if((u.email||'').toLowerCase()!==ADMIN){$('#root').innerHTML=`<div class="login"><h2 style="margin:0">Acesso restrito</h2><p style="margin:0;color:var(--muted)">Esta área é só para o administrador do Meu Púlpito.</p><button class="btn ghost" id="lo">Sair</button></div>`;$('#lo').onclick=()=>auth.signOut();return}
  try{localStorage.setItem('mp.adm','1')}catch(e){}shell();load()});

function shell(){$('#root').innerHTML=`<header class="top"><img src="../app/mark.png" alt=""><div><b>MEU <span>PÚLPITO</span></b><small>ESCRITÓRIO</small></div><span class="sp"></span>
  <a id="toapp" href="../app/" title="Voltar ao app">${ic('back')}<span>App</span></a><button id="rf" title="Atualizar">${ic('undo')}</button><button id="lo" title="Sair">${ic('out')}</button></header>
  <nav class="tabs" id="tabs"></nav><main id="main"><div class="empty">Carregando…</div></main>`;
  $('#rf').onclick=()=>{D.vis=null;load()};$('#lo').onclick=()=>auth.signOut();
  $('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;TAB=b.dataset.t;CONV=null;history.replaceState(null,'','#'+TAB);draw()}}
const TABS=[['resumo','home','Resumo'],['atend','chat','Atendimento'],['pastores','user','Pastores'],['pag','cash','Pagamentos'],['ind','star','Indicações'],['dep','quote','Depoimentos'],['aviso','send','Aviso no app'],['site','globe','Site'],['cfg','gear','Preços e pagamento']];
function unread(){return D.suporte.reduce((s,x)=>s+(+x.ua||0),0)+D.contato.filter(x=>!x.done).length}
function drawTabs(){const u=unread(),dp=D.depo.filter(x=>x.ok&&!x.pub).length;$('#tabs').innerHTML=TABS.map(([k,i,l])=>`<button data-t="${k}" aria-pressed="${TAB===k}">${ic(i)}${l}${k==='atend'&&u?` <span class="bdg">${u}</span>`:''}${k==='dep'&&dp?` <span class="bdg">${dp}</span>`:''}</button>`).join('')}

const LOADN={pend:new Set(),err:{}};function loadMsg(){const m=$('#main');if(!m||!LOADN.pend.size)return;const t=m.querySelector('.empty');if(t&&/Carregando/.test(t.textContent))t.textContent='Carregando… ('+[...LOADN.pend].join(', ')+')'}
async function get(c){LOADN.pend.add(c);loadMsg();try{const q=await Promise.race([db.collection(c).get(),new Promise((_,ko)=>setTimeout(()=>ko(new Error('tempo esgotado')),20000))]);LOADN.pend.delete(c);loadMsg();return q.docs.map(d=>Object.assign({id:d.id},d.data()))}catch(e){LOADN.pend.delete(c);LOADN.err[c]=String(e&&e.message||e).slice(0,80);loadMsg();return null}}
async function load(){const [st,pl,ro,de,su,co,cf]=await Promise.all(['stats','planos','roleta','depo','suporte','contato','config'].map(get));
  if(!st){$('#main').innerHTML='<div class="empty">Não foi possível carregar ('+(LOADN.err.stats||'')+'). Verifique a internet e toque em atualizar.</div>';return}
  const bad=Object.keys(LOADN.err);if(bad.length)setTimeout(()=>toast('Não carregou: '+bad.join(', ')+'. Toque em atualizar.'),500);
  D.planos={};(pl||[]).forEach(p=>D.planos[p.id]=p);D.stats=st.filter(r=>!(D.planos[r.id]||{}).deleted);D.roleta={};(ro||[]).forEach(r=>D.roleta[r.id]=r);D.depo=(de||[]).sort((a,b)=>(b.at||0)-(a.at||0));
  D.suporte=(su||[]).sort((a,b)=>(b.at||0)-(a.at||0));D.contato=(co||[]).sort((a,b)=>(b.at||0)-(a.at||0));D.rules=!!su;
  D.cfg={};D.site={};(cf||[]).forEach(c=>{if(c.id==='app')D.cfg=c;if(c.id==='site')D.site=c;if(c.id==='payqr')D.payqr=c});
  live();try{const v=await db.collection('siteStats').doc(today()).get();D.visits=v.exists?v.data():{}}catch(e){D.visits=null}
  draw()}
setInterval(()=>{if(document.visibilityState==='visible'&&auth.currentUser&&TAB!=='pastores')refreshMsgs()},30000);

const P=uid=>D.planos[uid]||{};
function payReqs(){return D.stats.filter(r=>r.payReq&&r.payReq.at&&!(P(r.id).pays||[]).some(x=>+x.at>=+r.payReq.at)&&+(P(r.id).reqSeen||0)<+r.payReq.at).sort((a,b)=>b.payReq.at-a.payReq.at)}
const PAYM={py:'Paraguai (transferência, carteira ou QR)',br:'Brasil (Pix ou QR)'};
function state(r){const p=P(r.id),n=Date.now(),gr=(+D.cfg.grace||3)*864e5;
  if(PMON[p.plan]&&p.until>n)return'pago';if(PMON[p.plan]&&p.until&&p.until+gr>n)return'carencia';if(+p.trial>n)return'teste';if(PMON[p.plan]&&p.until)return'vencido';return'gratis'}
const STAG={pago:['ok','Premium'],carencia:['warn','Em carência'],teste:['gold','Teste'],vencido:['bad','Vencido'],gratis:['','Grátis']};
const pend=r=>(r.email||'')!==ADMIN&&!(P(r.id).ok||P(r.id).blocked||PMON[P(r.id).plan]);
function allPays(){const out=[];D.stats.forEach(r=>(P(r.id).pays||[]).forEach(p=>out.push(Object.assign({uid:r.id,name:r.name||r.email},p))));
  Object.keys(D.planos).forEach(id=>{if(!D.stats.find(r=>r.id===id))(D.planos[id].pays||[]).forEach(p=>out.push(Object.assign({uid:id,name:id.slice(0,6)},p)))});return out.sort((a,b)=>(b.at||0)-(a.at||0))}
function monthKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function sums(list){list=list.filter(p=>!p.test);const s={pyg:0,brl:0,n:list.length};list.forEach(p=>{s[p.cur==='brl'?'brl':'pyg']+=+p.amt||0});return s}
const realPays=uid=>(P(uid).pays||[]).filter(p=>!p.test);
const byName=uid=>{const r=D.stats.find(x=>x.id===uid);return r?(r.name||r.email||uid.slice(0,6)):uid.slice(0,6)};
function refData(){const by={};D.stats.forEach(r=>by[r.id.slice(0,8)]=r);const rs={};const N=Math.max(1,+D.cfg.refN||3);
  D.stats.forEach(r=>{if(!r.ref||!by[r.ref])return;const o=rs[r.ref]=rs[r.ref]||{who:by[r.ref],list:[],bought:0};o.list.push(r);if(realPays(r.id).length)o.bought++});
  Object.values(rs).forEach(o=>{o.given=+P(o.who.id).refMonths||0;o.due=Math.floor(o.bought/N)-o.given});return{rs:Object.values(rs).sort((a,b)=>b.due-a.due||b.bought-a.bought),N}}
function soon(){const n=Date.now(),wn=(+D.cfg.warn||7)*864e5;return D.stats.filter(r=>{const p=P(r.id);return PMON[p.plan]&&p.until&&p.until-n<wn&&p.until>n-30*864e5}).sort((a,b)=>P(a.id).until-P(b.id).until)}

  <div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Plano grátis e vencimentos</h3>
   <div class="two">${fld('cS','Sermões no plano grátis',F.serm,'','','numeric')}${fld('cD','Artigos do dicionário por dia',F.dic,'','','numeric')}</div>
   <div class="two">${fld('cC','Curiosidades liberadas',F.cur,'','','numeric')}${fld('cRf','Compras de indicados para ganhar 1 mês',C.refN??3,'','','numeric')}</div>
   <div class="two">${fld('cWn','Dias de aviso antes de vencer',C.warn??7,'','','numeric')}${fld('cGr','Dias de carência depois de vencer',C.grace??3,'','','numeric')}</div>
   ${fld('cW','WhatsApp para pagamentos (com código do país)',C.wa,'595981234567','','tel')}</div>
  <button class="btn gold" id="cGo" style="height:46px;width:100%;margin-top:14px">${ic('check')}Salvar preços e testes</button>
  <div class="card" style="display:flex;flex-direction:column;gap:12px;margin-top:22px"><h3>Formas de pagamento</h3><p style="margin:-4px 0 0;font-size:13px;color:var(--muted);line-height:1.5">Aparecem para o pastor quando ele escolhe um plano. Deixe em branco o que não usar.</p>
   <p style="margin:0;font-size:12.5px;color:var(--muted);line-height:1.5">O app escolhe sozinho pelo país do celular: aparelho no Paraguai vê os dados do Paraguai; no Brasil, os do Brasil. O pastor pode trocar o país na tela de pagamento.</p>
   <b style="font-size:14px">Transferência (Paraguai)</b><div class="two">${fld('pyBank','Banco',bk.bank,'Banco …')}${fld('pyName','Titular',bk.name)}</div><div class="two">${fld('pyAcc','Número da conta',bk.acc,'','','numeric')}${fld('pyAlias','Alias',bk.alias)}</div>${fld('pyDoc','Cédula ou RUC',bk.doc)}${fld('pyObs','Observação (opcional, aparece embaixo dos dados)',bk.obs,'Ex.: Pelo app do Banco Familiar, use a conta 81-58132.')}
   <b style="font-size:14px">Carteira digital (Paraguai): Tigo Money, Billetera Personal ou Zimple</b><div class="two">${fld('tgNum','Número',tg.num,'09…','','tel')}${fld('tgName','Titular',tg.name)}</div>${fld('tgDoc','Cédula',tg.doc)}
   <p style="margin:0;font-size:12.5px;color:var(--muted);line-height:1.5">QR do Paraguai: se o seu banco gera o QR <b>com valor fixo</b>, envie um QR por plano (o app mostra o do plano escolhido). Se gera um QR <b>sem valor</b>, envie só o geral. Confira no banco se o QR pode ser usado várias vezes e não vence.</p>
   ${qrBox('py','QR geral do Paraguai (sem valor)')}
   <div class="two">${['m','t','a','mi','ti','ai'].map(k=>qrBox('py_'+k,'QR · '+PNAME[k]+' · '+money(+((C.p||{})[k]||{}).pyg||P[k].pyg,'pyg'))).join('')}</div>
   <b style="font-size:14px">Pix (Brasil)</b><div class="two">${fld('pxKey','Chave Pix',pix.key)}${fld('pxName','Titular',pix.name)}</div>${fld('pxBank','Banco',pix.bank)}
   ${qrBox('br','QR do Pix (Brasil)')}
   <b style="font-size:14px">Cartão de crédito ou débito</b><p style="margin:-6px 0 0;font-size:12.5px;color:var(--muted)">Link de pagamento de cada plano (Bancard, Pagopar ou outro). Deve começar com https://</p>
   <div class="two">${['m','t','a','mi','ti','ai'].map(k=>fld('cd_'+k,PNAME[k],card[k],'https://…','','url')).join('')}</div>
   <button class="btn dark" id="pyGo" style="height:46px">${ic('check')}Salvar formas de pagamento</button></div>`;
  $('#cGo').onclick=async()=>{const p={};$$('[data-p]').forEach(i=>{const [k,c]=i.dataset.p.split('.');(p[k]=p[k]||{})[c]=num(i.value)});
    const v=id=>$('#'+id).value;const cfg={test:$('#cT').checked,gate:$('#cG').checked,p,free:{serm:num(v('cS'))||2,dic:num(v('cD')),cur:num(v('cC'))},refN:Math.min(20,num(v('cRf'))||3),warn:num(v('cWn')),grace:num(v('cGr')),wa:v('cW').replace(/\D/g,''),updated:Date.now()};
    const b=$('#cGo');b.disabled=true;try{await db.collection('config').doc('app').set(cfg,{merge:true});D.cfg=Object.assign({},D.cfg,cfg);toast(cfg.test?'Salvo · Modo teste ligado':'Salvo · cada conta usa o seu plano');draw()}catch(err){toast('Não foi possível salvar');b.disabled=false}};
  m.querySelectorAll('[data-qrf]').forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;const k=inp.dataset.qrf;const img=new Image();const u=URL.createObjectURL(f);img.onload=async()=>{let box=null;try{box=await qrBoxOf(img)}catch(e){}qrCropSheet(img,box,d=>{URL.revokeObjectURL(u);if(d.length>110000){toast('Imagem muito grande.');return}const el=$('#qrimg_'+k);el.src=d;el.style.visibility='visible';$('[data-qrx='+k+']').hidden=false;$('[data-qrc='+k+']').hidden=false;toast('Recorte pronto. Toque em «Salvar formas de pagamento».')})};img.src=u});
  (async()=>{let n=0;for(const el of m.querySelectorAll('img[id^=qrimg_]')){if(!el.src.startsWith('data:')||el.dataset.cropped)continue;const img=new Image();await new Promise(ok=>{img.onload=ok;img.onerror=ok;img.src=el.src});if(!img.width)continue;try{const {d,found,part}=await qrCrop(img);if(found&&part<.7){el.src=d;el.dataset.cropped='1';n++}}catch(e){}}
    if(n){const b=$('#pyGo');if(b){b.textContent='';b.innerHTML=ic('check')+'Salvar formas de pagamento ('+n+' QR recortado'+(n>1?'s':'')+')';b.style.background='var(--gold)';b.style.color='#0B1220'}toast('Recortei '+n+' QR. Toque em «Salvar formas de pagamento» para publicar.')}})();
  m.querySelectorAll('[data-qrc]').forEach(b=>b.onclick=async()=>{const el=$('#qrimg_'+b.dataset.qrc);if(!el.src.startsWith('data:'))return;const img=new Image();img.onload=async()=>{let box=null;try{box=await qrBoxOf(img)}catch(e){}qrCropSheet(img,box,d=>{el.src=d;toast('Recorte pronto. Toque em «Salvar formas de pagamento».')})};img.src=el.src});
  m.querySelectorAll('[data-qrx]').forEach(b=>b.onclick=()=>{const el=$('#qrimg_'+b.dataset.qrx);el.src='';el.style.visibility='hidden';b.hidden=true;$('[data-qrc='+b.dataset.qrx+']').hidden=true});
  $('#pyGo').onclick=async()=>{const g=id=>($('#'+id).value||'').trim();const cd={};for(const k of ['m','t','a','mi','ti','ai']){const x=g('cd_'+k);if(x&&!httpsOk(x)){toast('O link de '+PNAME[k]+' deve começar com https://');return}cd[k]=x}
    const pay={bk:{bank:g('pyBank'),name:g('pyName'),acc:g('pyAcc'),alias:g('pyAlias'),doc:g('pyDoc'),obs:g('pyObs').slice(0,200)},tigo:{num:g('tgNum'),name:g('tgName'),doc:g('tgDoc')},pix:{key:g('pxKey'),name:g('pxName'),bank:g('pxBank')},card:cd};const qv=k=>{const e=$('#qrimg_'+k);return e&&e.src.startsWith('data:')?e.src:''};const payqr={py:qv('py'),br:qv('br'),updated:Date.now()};['m','t','a','mi','ti','ai'].forEach(k=>payqr['py_'+k]=qv('py_'+k));if(JSON.stringify(payqr).length>950000){toast('As imagens juntas ficaram grandes demais. Use capturas só do QR.');return}
    const b=$('#pyGo');b.disabled=true;try{await db.collection('config').doc('app').set({pay,updated:Date.now()},{merge:true});await db.collection('config').doc('payqr').set(payqr);D.cfg=Object.assign({},D.cfg,{pay});D.payqr=payqr;toast('Formas de pagamento salvas');b.disabled=false}catch(err){toast('Não foi possível salvar');b.disabled=false}}}
document.addEventListener('click',async e=>{const pb=e.target.closest('#main [data-pay]');if(pb&&TAB==='pag'){payForm(pb.dataset.pay);return}const rx=e.target.closest('[data-reqx]');if(rx){rx.disabled=true;try{await db.collection('planos').doc(rx.dataset.reqx).set({reqSeen:+rx.dataset.at},{merge:true});D.planos[rx.dataset.reqx]=Object.assign({},P(rx.dataset.reqx),{reqSeen:+rx.dataset.at});draw()}catch(err){rx.disabled=false;toast('Não foi possível salvar')}return}
  const p=e.target.closest('[data-pub]'),d=e.target.closest('[data-ddel]'),o=e.target.closest('[data-ton]');
  if(p){const x=D.depo.find(z=>z.id===p.dataset.pub);if(!x)return;p.disabled=true;const T=(Array.isArray(D.site.testi)?D.site.testi:[]).slice();T.push({q:String(x.q).slice(0,600),n:String(x.n).slice(0,80),r:String(x.r||'').slice(0,120),v:'',on:true});
    try{await db.collection('config').doc('site').set({testi:T,updated:Date.now()},{merge:true});await db.collection('depo').doc(x.id).set({pub:true},{merge:true});D.site.testi=T;x.pub=true;toast('Publicado no site');draw()}catch(err){p.disabled=false;toast('Não foi possível publicar')}}
  if(d){if(!sure(d,'Apagar?'))return;try{await db.collection('depo').doc(d.dataset.ddel).delete();D.depo=D.depo.filter(z=>z.id!==d.dataset.ddel);draw()}catch(err){toast('Não foi possível apagar')}}
  if(o){const T=(D.site.testi||[]).slice();const i=+o.dataset.ton;T[i]=Object.assign({},T[i],{on:T[i].on===false});try{await db.collection('config').doc('site').set({testi:T,updated:Date.now()},{merge:true});D.site.testi=T;draw()}catch(err){toast('Não foi possível salvar')}}});
})();
</script>
</body>
</html>
