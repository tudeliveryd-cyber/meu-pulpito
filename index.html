<style>
:root{
  --navy:#0B1220;--navy-2:#111A2E;--navy-3:#1A2540;--ink:#0F172A;--text:#334155;--muted:#64748B;--line:#E6E8EE;--soft:#F5F6F8;
  --gold:#C9A24E;--gold-2:#B8913F;--gold-soft:rgba(201,162,78,.12);--white:#fff;
  --head:'Manrope','Inter',system-ui,-apple-system,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --wrap:1160px;--r:18px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.6;color:var(--text);background:var(--white);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--head);color:var(--ink);margin:0;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 26px;border-radius:26px;font-family:var(--head);font-weight:700;font-size:15.5px;letter-spacing:-.005em;transition:transform .18s ease,background .18s ease,box-shadow .18s ease,color .18s ease;white-space:nowrap;cursor:pointer;border:0}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.gold{background:var(--gold);color:#0B1220;box-shadow:0 6px 20px rgba(201,162,78,.25)}
.btn.gold:hover{background:#D3AE5C}
.btn.line{color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.28) inset}
.btn.line:hover{box-shadow:0 0 0 1px rgba(255,255,255,.6) inset}
.btn.dark{background:var(--navy);color:#fff}
.btn.dark:hover{background:var(--navy-3)}
.btn.out{color:var(--ink);box-shadow:0 0 0 1px var(--line) inset;background:#fff}
.btn.out:hover{box-shadow:0 0 0 1px #C9CED8 inset}
.btn svg{width:18px;height:18px}
.eyebrow{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* navegación */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .25s ease,box-shadow .25s ease;padding-top:env(safe-area-inset-top,0px)}
.nav.solid{background:rgba(11,18,32,.92);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:72px}
.topbar{display:block;background:var(--gold);color:var(--navy);text-align:center;font-family:var(--head);font-weight:700;font-size:13.5px;line-height:1.35;padding:9px 16px;text-wrap:balance}
.topbar[hidden]{display:none}
a.topbar[href]{text-decoration:underline;text-underline-offset:3px}

/* botón flotante de WhatsApp */
.wa-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:54px;height:54px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;box-shadow:0 10px 28px -8px rgba(11,18,32,.55),0 0 0 1px rgba(201,162,78,.45) inset;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.wa-fab.on{opacity:1;transform:none;pointer-events:auto}.wa-fab svg{width:25px;height:25px}
body.has-bar .hero{padding-top:calc(env(safe-area-inset-top,0px) + 186px)}
.brand{display:flex;align-items:center;gap:11px;color:#fff}
.brand img{height:38px;width:auto}
.brand b{font-family:var(--head);font-weight:800;font-size:17px;letter-spacing:.01em;line-height:1}
.brand b span{color:var(--gold)}
.brand small{display:block;margin-top:4px;font-family:var(--head);font-weight:700;font-size:8.5px;letter-spacing:.17em;color:rgba(255,255,255,.55)}
.nav ul{display:flex;gap:26px;list-style:none;margin:0 0 0 auto;padding:0}
.nav ul a{font-family:var(--head);font-weight:600;font-size:14.5px;color:rgba(255,255,255,.78);transition:color .15s}
.nav ul a:hover{color:#fff}
.lang{display:flex;gap:2px;padding:3px;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.lang button{border:0;background:none;color:rgba(255,255,255,.65);font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.06em;height:28px;padding:0 10px;border-radius:14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.nav .btn{height:42px;padding:0 20px;font-size:14.5px}
@media (max-width:1020px){.nav .wrap{gap:16px}.nav ul{gap:16px}.nav ul a{font-size:13.5px}}
@media (min-width:781px) and (max-width:1020px){.nav .brand small{display:none}}
@media (max-width:780px){.nav ul{display:none}.nav .lang{margin-left:auto}}
@media (max-width:420px){.nav .btn{height:38px;padding:0 14px;font-size:13.5px}.lang button{padding:0 9px}.brand b{font-size:14px}.brand img{height:28px;width:auto}.nav .wrap{gap:10px}}
@media (max-width:480px){.brand small{font-size:6.4px;letter-spacing:.06em;margin-top:3px;white-space:nowrap}.nav .lang button{padding:0 8px}.brand b{font-size:15px;white-space:nowrap}.brand img{height:32px}.nav .btn{padding:0 16px}.nav .wrap{gap:12px}}
@media (max-width:380px){.nav .brand{gap:8px}.nav .brand img{height:27px}.nav .brand b{font-size:13.5px}.nav .brand small{font-size:5.8px;letter-spacing:.05em}.nav .lang button{padding:0 7px;font-size:11px}.nav .btn{padding:0 12px;font-size:13px}.nav .wrap{gap:8px}}

/* portada */
.hero{position:relative;background:var(--navy);color:#C5CCDA;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 140px) 0 0}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 520px at 78% 30%,rgba(41,64,112,.55),transparent 70%),radial-gradient(600px 400px at 10% 100%,rgba(201,162,78,.07),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero h1{color:#fff;font-size:clamp(38px,5.2vw,62px);line-height:1.06;font-weight:800;letter-spacing:-.032em;margin:18px 0 22px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lead{font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#AEB7C8;max-width:540px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.hero .facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:34px;font-size:14px;color:#8F9AAF}
.hero .facts span{display:inline-flex;align-items:center;gap:8px}
.hero .facts svg{width:17px;height:17px;color:var(--gold)}
.hero .eyebrow{color:var(--gold)}
.phones{position:relative;height:640px}
.phone{position:absolute;width:290px;aspect-ratio:390/844;border-radius:46px;padding:9px;background:#05080F;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 40px 80px -20px rgba(0,0,0,.55),0 18px 40px -18px rgba(0,0,0,.6)}
.phone img{width:100%;height:100%;object-fit:cover;border-radius:38px}
.phones .p1{left:6%;top:30px;z-index:2}
.phones .p2{right:2%;top:110px;transform:scale(.92);transform-origin:top right;opacity:.96}
@media (max-width:900px){
  .hero{padding-top:calc(env(safe-area-inset-top,0px) + 112px)}
  .hero .wrap{grid-template-columns:1fr;gap:56px}
  .phones{height:520px;max-width:520px;margin:0 auto;width:100%}
  .phone{width:236px;border-radius:38px;padding:8px}.phone img{border-radius:31px}
  .phones .p1{left:calc(50% - 210px)}.phones .p2{right:calc(50% - 210px);top:80px}
}
@media (max-width:480px){.phones{height:470px}.phones .p1{left:2%}.phones .p2{right:2%;top:70px}.phone{width:210px}.hero .ctas .btn{flex:1 1 100%}}

/* secciones */
section{scroll-margin-top:72px}
.sec{padding:120px 0}
.sec.soft{background:var(--soft)}
.sec-h{max-width:720px;margin:0 auto 72px;text-align:center}
.sec-h h2{font-size:clamp(30px,3.6vw,44px);line-height:1.12;font-weight:800;margin-top:14px;text-wrap:balance}
.sec-h p{margin-top:18px;font-size:18px;color:var(--muted);text-wrap:pretty}
@media (max-width:700px){.sec{padding:64px 0}.sec-h{margin-bottom:40px}.more{margin-top:64px}.feat+.feat{margin-top:28px!important}.feat{gap:32px!important}.ft-media .phone{width:230px!important}}

/* funciones */
.feat{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;padding:28px 0}
.feat+.feat{margin-top:72px}
.feat.rev .ft-media{order:2}
.ft-media{display:flex;justify-content:center;position:relative}
.ft-media::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(201,162,78,.13),transparent 68%);top:50%;left:50%;transform:translate(-50%,-50%)}
.ft-media .phone{position:relative;width:300px}
.ft-num{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--gold-2);text-transform:uppercase}
.ft-text h3{font-size:clamp(26px,2.6vw,34px);line-height:1.15;font-weight:800;margin:12px 0 16px}
.ft-text>p{font-size:17.5px;color:var(--text);max-width:500px}
.ft-list{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:13px;max-width:500px}
.ft-list li{display:flex;gap:12px;font-size:16px;line-height:1.5;color:var(--text)}
.ft-list svg{width:20px;height:20px;color:var(--gold-2);margin-top:2px}
.ft-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.ft-tags span{font-family:var(--head);font-weight:600;font-size:13px;color:var(--ink);background:#fff;box-shadow:0 0 0 1px var(--line) inset;border-radius:10px;padding:7px 12px}
.sec.soft .ft-tags span{background:#fff}
@media (max-width:860px){.feat{grid-template-columns:1fr;gap:44px}.feat.rev .ft-media{order:0}.feat+.feat{margin-top:40px}.ft-media .phone{width:250px}}

/* más herramientas */
.more{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:96px}
.tool{background:#fff;border-radius:22px;box-shadow:0 0 0 1px var(--line) inset;overflow:hidden;display:flex;flex-direction:column}
.tool .shot{background:var(--navy);height:270px;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding-top:28px}
.tool .shot .phone{position:relative;flex:none;width:220px;border-radius:34px;padding:7px;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.tool .shot .phone img{border-radius:28px}
.tool .tx{padding:26px 26px 30px}
.tool h3{font-size:20px;font-weight:800;margin-bottom:8px}
.tool p{font-size:15.5px;color:var(--muted);line-height:1.55}
.tool .ico{width:250px;height:250px;margin:auto;display:flex;align-items:center;justify-content:center}
@media (max-width:1060px){.more{grid-template-columns:repeat(2,1fr);max-width:760px;margin-left:auto;margin-right:auto}}
@media (max-width:600px){.more{grid-template-columns:1fr;max-width:480px}}
.devs{position:relative;max-width:1040px;margin:0 auto;padding:0 0 4% 0}
.dv-pc{width:76%;margin:0 auto}
.dv-scr{background:#05080F;border-radius:16px 16px 0 0;padding:1.4%;box-shadow:0 0 0 1px #2A3550 inset,0 30px 70px rgba(11,18,32,.28)}
.dv-scr img{width:100%;height:auto;border-radius:6px}
.dv-base{height:14px;margin:0 -5%;background:linear-gradient(#D5D9E1,#AEB4C0);border-radius:0 0 14px 14px;box-shadow:0 14px 30px rgba(11,18,32,.18)}
.dv-tab{position:absolute;left:0;bottom:0;width:36%;background:#05080F;border-radius:18px;padding:1.3%;box-shadow:0 0 0 1px #2A3550 inset,0 24px 60px rgba(11,18,32,.35)}
.dv-tab img{width:100%;height:auto;border-radius:10px}
.dv-ph{position:absolute;right:1%;bottom:0;width:15%;background:#05080F;border-radius:24px;padding:.9%;box-shadow:0 0 0 1px #2A3550 inset,0 24px 60px rgba(11,18,32,.35)}
.dv-ph img{width:100%;height:auto;border-radius:18px}
.dv-cap{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
.dv-cap>div{text-align:center}
.dv-cap .i{width:26px;height:26px;color:var(--gold-2);margin:0 auto 10px}
.dv-cap h3{font-size:19px;font-weight:800;margin-bottom:6px}
.dv-cap p{font-size:15.5px;color:var(--muted);line-height:1.55}
@media (max-width:700px){.devs{padding-bottom:10%}.dv-pc{width:92%}.dv-tab{width:44%;bottom:-2%}.dv-ph{width:20%;bottom:-2%}.dv-cap{grid-template-columns:1fr;gap:28px;margin-top:48px}.dv-scr{border-radius:10px 10px 0 0}.dv-base{height:9px}.dv-tab{border-radius:12px}.dv-ph{border-radius:14px}.dv-ph img{border-radius:10px}}
.ft-note{margin-top:14px;font-size:14px;color:var(--muted)}
.cmp{max-width:860px;margin:56px auto 0}
.cmp h3{font-size:22px;font-weight:800;text-align:center;margin-bottom:20px}
.cmp-t{border-radius:18px;box-shadow:0 0 0 1px var(--line) inset;overflow:hidden;background:#fff}
.cmp-r{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);align-items:stretch;border-top:1px solid var(--line)}
.cmp-r:first-child{border-top:0;background:var(--soft)}
.cmp-r>div{padding:13px 16px;font-size:14.5px;line-height:1.45;color:var(--text);display:flex;align-items:center;overflow-wrap:break-word}
.cmp-r>div:first-child{font-family:var(--head);font-weight:700;color:var(--ink)}
.cmp-r>div:last-child{background:var(--gold-soft)}
.cmp-r:first-child>div{font-family:var(--head);font-weight:800;color:var(--ink);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.cmp-r .i{width:18px;height:18px;color:var(--gold-2)}
.cmp-r .no{color:#A0A8B8}
@media (max-width:560px){.cmp-r{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}.cmp-r>div{padding:11px 10px;font-size:13px}.cmp-r:first-child>div{font-size:11px}}

/* pasos */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{padding:30px 28px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line) inset}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:800;font-size:16px;margin-bottom:20px}
.step h3{font-size:19px;font-weight:800;margin-bottom:8px}
.step p{font-size:15.5px;color:var(--muted)}
@media (max-width:700px){.steps{grid-template-columns:1fr;max-width:520px;margin:0 auto}}

/* planes */
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:stretch}
.plans-i{grid-template-columns:repeat(3,1fr);max-width:900px;margin:18px auto 0}
.pli{max-width:720px;margin:56px auto 0;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}.pli h3{font-size:26px;font-weight:800}.pli p{color:var(--muted);line-height:1.55}
.plan{position:relative;display:flex;flex-direction:column;gap:14px;padding:30px 24px 26px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line) inset}
.plan.best{background:var(--navy);box-shadow:0 0 0 1.5px var(--gold) inset,0 24px 50px -24px rgba(11,18,32,.55)}
.plan.best h3,.plan.best .price{color:#fff}.plan.best .per,.plan.best .eq,.plan.best li{color:#AEB7C8}
.badge{margin:-30px -24px 4px;text-align:center;background:var(--gold);color:var(--navy);font-family:var(--head);font-weight:800;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:9px 14px;border-radius:21px 21px 0 0;line-height:1.35}
.plan h3{font-size:18px;font-weight:800}
.price{font-family:var(--head);font-weight:800;font-size:34px;letter-spacing:-.025em;color:var(--ink);line-height:1}
.per{font-size:14px;color:var(--muted);font-weight:500}
.eq{font-size:13.5px;color:var(--muted);margin-top:-6px}
.save{align-self:flex-start;font-family:var(--head);font-weight:700;font-size:12.5px;color:#166534;background:#E8F5EC;border-radius:8px;padding:4px 9px}
.plan.best .save{background:rgba(201,162,78,.18);color:var(--gold)}
.plan ul{list-style:none;padding:0;margin:4px 0 8px;display:grid;gap:9px;flex:1}

.testi{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}

.dh h2{margin:10px 0 16px;font-size:30px;color:var(--ink)}
.dh-v{margin:0 0 18px;padding:18px 22px;border-left:4px solid var(--gold);background:var(--soft);border-radius:0 14px 14px 0;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:var(--ink)}
.dh-v cite{display:block;margin-top:10px;font-family:var(--head);font-style:normal;font-weight:700;font-size:14px;color:var(--gold-2)}
.dh-r{margin:0 0 6px;font-size:17px;line-height:1.7;color:var(--text)}.dh-r.fade{-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}.dh-more{margin:0 0 20px;font-size:14.5px;color:var(--muted);font-weight:600}
.dh-boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}.dh-boxes>div{padding:16px 18px;border-radius:16px;box-shadow:0 0 0 1px var(--line) inset}.dh-boxes>div.pr{background:var(--gold-soft);box-shadow:0 0 0 1px rgba(201,162,78,.4) inset}
.dh-boxes span{font-family:var(--head);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2)}.dh-boxes p{margin:8px 0 0;line-height:1.6;color:var(--ink)}.dh-boxes .pr p{font-style:italic}
.dh-cta{display:flex;gap:12px;flex-wrap:wrap}.dh-cta .btn.line{color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;background:#fff}
@media (max-width:640px){.dh-cta{flex-direction:column}.dh-cta .btn{white-space:normal;text-align:center;height:auto;min-height:48px;padding-top:10px;padding-bottom:10px}.dh{padding:24px 20px;border-radius:20px}.dh h2{font-size:24px}.dh-v{font-size:17px;padding:14px 16px}.dh-boxes{grid-template-columns:1fr}.dh-cta .btn{flex:1}}
#devocional{scroll-margin-top:90px}

.rf-sec{padding-top:0}
.rf-box{display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center;background:var(--navy);color:#fff;border-radius:28px;padding:48px;box-shadow:0 30px 70px rgba(11,18,32,.25)}

.rf-wheel p{margin:18px 0 0;display:flex;flex-direction:column;gap:4px}.rf-wheel strong{font-family:var(--head);font-size:19px;color:var(--gold)}.rf-wheel p span{color:rgba(255,255,255,.7);font-size:14.5px;line-height:1.5}
